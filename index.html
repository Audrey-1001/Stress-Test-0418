<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理压力测评系统</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2d3436;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: #eef2f7; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--text); }
        .container { width: 95%; max-width: 500px; background: var(--card); padding: 35px 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); overflow: hidden; position: relative; }
        .progress-bar { height: 6px; background: #eee; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.4s ease; }
        .q-area { position: relative; min-height: 350px; }
        .q-card { position: absolute; width: 100%; visibility: hidden; opacity: 0; transform: translateX(30px); transition: all 0.4s ease; }
        .q-card.active { visibility: visible; opacity: 1; transform: translateX(0); }
        .q-card.exit { visibility: hidden; opacity: 0; transform: translateX(-30px); }
        .q-text { font-size: 19px; font-weight: 600; margin-bottom: 25px; line-height: 1.5; }
        .opt-btn { display: block; width: 100%; padding: 16px; margin-bottom: 12px; border: 1.5px solid #f0f0f0; border-radius: 12px; background: #fff; cursor: pointer; text-align: left; font-size: 16px; transition: 0.2s; }
        .opt-btn:hover { border-color: var(--primary); background: #f9f8ff; }
        #result { display: none; }
        .type-tag { font-size: 40px; font-weight: 800; color: var(--primary); text-align: center; margin: 10px 0; letter-spacing: 3px; }
        pre { background: #f1f2f6; padding: 15px; border-radius: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
        .summary-box { background: #f8f9fa; border-left: 4px solid var(--primary); padding: 15px; margin: 15px 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-ui">
        <h2 style="text-align:center; color:var(--primary); margin:0;">心理压力测评</h2>
        <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
        <div class="q-area" id="q-container"></div>
    </div>

    <div id="result">
        <h2 style="text-align:center;">测评报告生成成功</h2>
        <div class="type-tag" id="res-type"></div>
        <div class="summary-box" id="res-summary"></div>
        <p style="font-size:12px; color:#666;">报告 JSON 数据 (可直接复制):</p>
        <pre id="json-output"></pre>
        <button class="opt-btn" style="text-align:center; margin-top:10px;" onclick="location.reload()">重新测评</button>
    </div>
</div>

<script>
const config = {
    scoring: {
        option_values: {"A":1,"B":2,"C":3,"D":4},
        dimensions: {
            "emotion":{"label":"情绪压力","threshold_low":16,"threshold_high":24},
            "behavior":{"label":"行为压力","threshold_low":16,"threshold_high":24},
            "cognition":{"label":"认知压力","threshold_low":16,"threshold_high":24},
            "social":{"label":"社交压力","threshold_low":12,"threshold_high":18}
        },
        type_mapping:{
            "emotion":{"low":"E","medium":"M","high":"H"},
            "behavior":{"low":"B","medium":"N","high":"D"},
            "cognition":{"low":"C","medium":"P","high":"R"},
            "social":{"low":"S","medium":"U","high":"T"}
        },
        texts: {
            emotion: { low:"你的情绪稳定，遇事冷静。心态稳。", medium:"情绪偶尔波动。建议冥想。", high:"情绪波动较大。建议放松活动。" },
            behavior: { low:"自律且高效。", medium:"偶尔拖延。建议分解任务。", high:"容易冲动或紊乱。建议规划日程。" },
            cognition: { low:"思维清晰理性。", medium:"偶尔分心。建议记录任务。", high:"容易犹豫分心。建议分阶段完成工作。" },
            social: { low:"社交适应力强。", medium:"社交偶尔感压力。建议沟通。", high:"社交压力大。建议寻求支持。" }
        },
        overall: { low:"压力水平低，状态良好。", medium:"压力中等，建议适当放松。", high:"压力较高，建议寻求支持。" }
    },
    questions: [
        {id:1,dim:"emotion",text:"面对紧急任务，你会怎样反应？",opts:["保持冷静","有些紧张","焦虑明显","无法集中"]},
        {id:2,dim:"emotion",text:"遇到生活琐事，你的心情如何？",opts:["不受影响","偶尔烦躁","经常烦心","情绪低落"]},
        {id:3,dim:"emotion",text:"压力下你的睡眠状况？",opts:["正常","偶尔失眠","经常难入睡","总失眠"]},
        {id:4,dim:"emotion",text:"面对未来不确定性？",opts:["很少担心","偶尔担心","经常焦虑","总是担心"]},
        {id:5,dim:"emotion",text:"遇到挫折你会？",opts:["快速调整","需要时间","低落一段时间","无法摆脱"]},
        {id:6,dim:"emotion",text:"与人争执的情绪？",opts:["冷静","控制得住","易失控","无法控制"]},
        {id:7,dim:"emotion",text:"任务繁重时？",opts:["动力足","有压力","难以集中","极度紧张"]},
        {id:8,dim:"emotion",text:"日常情绪起伏？",opts:["稳定","偶尔波动","经常波动","总是不稳"]},
        {id:9,dim:"behavior",text:"完成任务的方式？",opts:["按计划","有时拖延","经常拖延","半途而废"]},
        {id:10,dim:"behavior",text:"压力下饮食情况？",opts:["正常","偶尔变化","不规律","明显紊乱"]},
        {id:11,dim:"behavior",text:"压力下运动习惯？",opts:["规律","减少","经常不运动","基本停止"]},
        {id:12,dim:"behavior",text:"压力下社交状态？",opts:["正常","偶尔回避","经常回避","很少接触"]},
        {id:13,dim:"behavior",text:"冲动行为？",opts:["很少","偶尔","经常","总是"]},
        {id:14,dim:"behavior",text:"处理琐事态度？",opts:["井井有条","有时混乱","经常混乱","难以整理"]},
        {id:15,dim:"behavior",text:"压力对作息影响？",opts:["不影响","偶尔","经常","严重"]},
        {id:16,dim:"behavior",text:"注意力？",opts:["集中","偶尔分散","经常分散","无法集中"]},
        {id:17,dim:"cognition",text:"做决策状态？",opts:["冷静","有时犹豫","经常犹豫","难做决定"]},
        {id:18,dim:"cognition",text:"复杂问题思路？",opts:["清晰","有时混乱","经常混乱","总是卡住"]},
        {id:19,dim:"cognition",text:"压力下记忆力？",opts:["正常","偶尔遗忘","经常遗忘","总是忘事"]},
        {id:20,dim:"cognition",text:"工作效率？",opts:["高效","低效","经常低效","总是低效"]},
        {id:21,dim:"cognition",text:"思维敏捷性？",opts:["快速","稍慢","经常迟缓","总是迟缓"]},
        {id:22,dim:"cognition",text:"担忧细节？",opts:["很少","偶尔","经常","总是"]},
        {id:23,dim:"cognition",text:"多任务表现？",opts:["有条不紊","偶尔混乱","经常混乱","难处理"]},
        {id:24,dim:"cognition",text:"思维弹性？",opts:["灵活","不灵活","经常僵硬","总是僵硬"]},
        {id:25,dim:"social",text:"与人相处压力感？",opts:["很低","有时紧张","经常紧张","压力大"]},
        {id:26,dim:"social",text:"家庭责任压力？",opts:["很低","有时压力","经常压力","压力大"]},
        {id:27,dim:"social",text:"未来规划焦虑？",opts:["很少","偶尔","经常","总是"]},
        {id:28,dim:"social",text:"表达意见时？",opts:["自如","不安","经常不安","总是紧张"]},
        {id:29,dim:"social",text:"社交冲突反应？",opts:["冷静","偶尔情绪化","经常情绪化","难控制"]},
        {id:30,dim:"social",text:"休闲能放松吗？",opts:["总能","大部分时间","偶尔","很少"]}
    ]
};

let current = 0;
let scores = { emotion:0, behavior:0, cognition:0, social:0 };
const answers = ["A","B","C","D"];

function init() {
    const container = document.getElementById('q-container');
    config.questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = `q-card ${i===0?'active':''}`;
        div.innerHTML = `<div class="q-text">${i+1}. ${q.text}</div>`;
        q.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => next(q.dim, answers[idx]);
            div.appendChild(btn);
        });
        container.appendChild(div);
    });
}

function next(dim, val) {
    scores[dim] += config.scoring.option_values[val];
    const cards = document.querySelectorAll('.q-card');
    cards[current].classList.replace('active', 'exit');
    current++;
    document.getElementById('p-fill').style.width = (current/config.questions.length)*100 + '%';
    if(current < config.questions.length) {
        setTimeout(() => cards[current].classList.add('active'), 100);
    } else {
        setTimeout(showReport, 400);
    }
}

function showReport() {
    document.getElementById('quiz-ui').style.display = 'none';
    const result = { type_code: "", dimension_analysis: [], overall_summary: "" };
    let totalScore = 0;

    for (let d in scores) {
        const s = scores[d];
        const th = config.scoring.dimensions[d];
        let level = s <= th.threshold_low ? "low" : (s <= th.threshold_high ? "medium" : "high");
        let levelChar = config.scoring.type_mapping[d][level];
        result.type_code += levelChar;
        totalScore += s;
        
        result.dimension_analysis.push({
            dimension: th.label,
            score: s,
            level: level === "low" ? "低" : (level === "medium" ? "中" : "高"),
            interpretation: config.scoring.texts[d][level]
        });
    }

    const avgScore = totalScore / 30;
    const overallLevel = avgScore <= 2 ? "low" : (avgScore <= 3 ? "medium" : "high");
    result.overall_summary = config.scoring.overall[overallLevel];

    document.getElementById('result').style.display = 'block';
    document.getElementById('res-type').innerText = result.type_code;
    document.getElementById('res-summary').innerText = result.overall_summary;
    document.getElementById('json-output').innerText = JSON.stringify(result, null, 2);
}

init();
</script>
</body>
</html>
